name: Update dependencies

on:
  schedule:
    - cron: "17 6 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ${{ matrix.ecosystem }} update
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Keep the shared Thursday 06:17 UTC fleet slot, but stagger expensive work internally.
        ecosystem: [cargo, npm, github-actions]
    permissions:
      contents: read
      copilot-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      COPILOT_VERSION: 1.0.83-3
      COPILOT_SHA256: 868c68d92d207cf1b68b4791b94b38d2cdeefc0717986bc5cd71843a83b41603
      CARGO_EDIT_VERSION: 0.13.10
      WASM_PACK_VERSION: 0.15.0
      PINACT_VERSION: 4.1.1
      PINACT_SHA256: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Copilot CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/copilot-linux-x64.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/github/copilot-cli/releases/download/v${COPILOT_VERSION}/copilot-linux-x64.tar.gz" \
            -o "$archive"
          echo "${COPILOT_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/copilot"
          tar -xzf "$archive" -C "$RUNNER_TEMP/copilot"
          echo "$RUNNER_TEMP/copilot" >> "$GITHUB_PATH"

      - name: Install Rust tools
        if: matrix.ecosystem == 'cargo' || matrix.ecosystem == 'npm'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          if [[ "${{ matrix.ecosystem }}" == "cargo" ]]; then
            cargo install cargo-edit --locked --version "$CARGO_EDIT_VERSION"
          else
            cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
          fi

      - name: Setup Node
        if: matrix.ecosystem == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: crates/string-offsets/js/package-lock.json

      - name: Install pinned pinact
        if: matrix.ecosystem == 'github-actions'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pinact_linux_amd64.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${PINACT_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/pinact"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pinact"
          echo "$RUNNER_TEMP/pinact" >> "$GITHUB_PATH"

      - name: Generate immutable update artifact
        id: generate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUNDLE_DIR: ${{ runner.temp }}/dependency-update/${{ matrix.ecosystem }}
        run: |
          set +e
          .github/scripts/generate-dependency-update "${{ matrix.ecosystem }}" "$BUNDLE_DIR"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable update artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-update-${{ matrix.ecosystem }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-update/${{ matrix.ecosystem }}
          retention-days: 7
          if-no-files-found: error

      - name: Report explicit generation failure
        if: steps.generate.outputs.rc != '0'
        env:
          GENERATE_RC: ${{ steps.generate.outputs.rc }}
        run: |
          echo "::error::${{ matrix.ecosystem }} dependency generation failed with exit ${GENERATE_RC}."
          exit "$GENERATE_RC"

  apply:
    name: Apply ${{ matrix.ecosystem }} update
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ecosystem: [cargo, npm, github-actions]
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main for guarded apply
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download immutable update artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependency-update-${{ matrix.ecosystem }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-update/${{ matrix.ecosystem }}

      - name: Apply guarded update and create or reuse draft PR
        env:
          BUNDLE_DIR: ${{ runner.temp }}/dependency-update/${{ matrix.ecosystem }}
        run: .github/scripts/apply-dependency-update "${{ matrix.ecosystem }}" "$BUNDLE_DIR"
