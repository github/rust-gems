[package]
name = "bpe-benchmarks"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
test = false

[[bench]]
name = "performance"
path = "performance.rs"
harness = false
test = false

[[test]]
name = "equivalence"
path = "equivalence.rs"
test = true

[dependencies]
bpe = { path = "../../bpe", features = ["rand", "tiktoken"] }
bpe-openai = { path = "../../bpe-openai" }
criterion = "0.8"
rand = "0.10"
serde_json = "1"
tiktoken-rs = "0.12"
tokenizers = {
    version = "=1.0.0-rc.4",
    default-features = false,
    features = ["bpe", "http", "normalizers", "regex", "serialize"],
}
